name: Workflow CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: CI=true npx nypm@latest i

      - name: Lint
        run: pnpm lint

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: CI=true npx nypm@latest i

      - name: Playground prepare
        run: pnpm dev:prepare

      - name: Typecheck
        run: pnpm test:types

      - name: Test
        run: pnpm test
