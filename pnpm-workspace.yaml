packages:
  - .
  - docs

overrides:
  # GHSA-g7r4-m6w7-qqqr, via docus > @nuxt/fonts > fontless
  esbuild: ^0.28.1

catalogs:
  # Nuxt core — shared by the module (root) and the docs site
  nuxt:
    '@nuxt/eslint-config': ^1.17.0
    '@nuxt/kit': ^4.5.2
    '@nuxt/module-builder': ^1.0.3
    '@nuxt/schema': ^4.5.2
    '@nuxt/test-utils': ^4.3.2
    '@types/node': ^26.6.3
    '@vueuse/core': ^15.0.0
    '@vueuse/nuxt': ^15.0.0
    nuxt: ^4.5.2
    typescript: ~5.9.3
    vue: ^3.5.43

  # Everything else the module depends on
  runtime:
    animejs: ^4.5.0
    defu: ^6.1.7

  tooling:
    '@vue/test-utils': ^2.5.1
    changelogen: ^0.6.2
    eslint: ^10.11.0
    jsdom: ^30.1.1
    lefthook: ^2.1.14
    vitest: ^5.0.2
    vue-tsc: ^3.3.11

# Upstream mismatches with no fixed release yet
peerDependencyRules:
  allowedVersions:
    # @nuxt/module-builder ships vue-sfc-transformer 0.2 against mkdist's 0.1 peer
    mkdist>vue-sfc-transformer: '0.2'
    # nuxt-component-meta (docus) pins older copies of these optional unctx peers
    unctx>unplugin: '2'
    unctx>oxc-parser: '0.139'

allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  esbuild: true
  lefthook: true
  sharp: true
  unrs-resolver: true
  vue-demi: true
