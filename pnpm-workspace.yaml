packages:
  - .
  - docs

overrides:
  h3: ^1.15.11
  '@nuxtjs/mdc': ^0.22.1
  '@tiptap/core': '>3.30.5'
  esbuild: ^0.28.1
  fast-uri: ^3.1.6
  hono: ^4.13.5
  js-yaml: ^4.3.2
  nuxt-og-image: ^6.7.0
  qs: ^6.16.0
  sharp: ^0.35.4
  svgo: ^4.1.0

catalogs:
  # Nuxt core — shared by the module (root) and the docs site
  nuxt:
    '@nuxt/eslint-config': ^1.17.0
    '@nuxt/kit': ^4.5.2
    '@nuxt/module-builder': ^1.0.3
    '@nuxt/schema': ^4.5.2
    '@nuxt/test-utils': ^4.1.0
    '@types/node': latest
    '@vueuse/core': ^14.4.0
    '@vueuse/nuxt': 14.4.0
    nuxt: ^4.5.2
    typescript: ~6.0.3
    vue: ^3.5.41

  # Everything else the module depends on
  runtime:
    animejs: ^4.5.0
    defu: ^6.1.7

  tooling:
    '@vue/test-utils': ^2.4.11
    changelogen: ^0.6.2
    eslint: ^10.9.0
    happy-dom: ^20.11.6
    lefthook: ^2.1.10
    vitest: ^4.1.11
    vue-tsc: ^3.3.11

onlyBuiltDependencies:
  - '@parcel/watcher'
  - better-sqlite3
  - esbuild
  - lefthook
  - sharp
  - unrs-resolver
  - vue-demi
